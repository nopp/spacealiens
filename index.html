<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Space Aliens</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <div class="tv">
      <canvas id="c" width="160" height="192" aria-label="Space Aliens"></canvas>
      <footer class="mark">
        <img src="assets/nopp-games.png" alt="nopp games" width="97" height="45">
      </footer>
    </div>
    <section class="help">
      <p><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> move</p>
      <p><kbd>Space</kbd>, <kbd>↑</kbd>, <kbd>Z</kbd>, or <kbd>X</kbd> fires. One beam at a time.</p>
      <p><kbd>Enter</kbd> starts · <kbd>P</kbd> pauses · <kbd>M</kbd> sound</p>
      <p class="scores">Bottom row 5, then 10, 15, 20, 25. Top row 30. Command ship 200. Three hits, or one invader on the ground, ends the game. The four-note march speeds up as the wave thins out.</p>
    </section>
    <div class="pad" aria-label="On-screen controls">
      <button type="button" data-hold="left" aria-label="Left">◀</button>
      <button type="button" data-hold="fire" class="fire" aria-label="Fire">FIRE</button>
      <button type="button" data-hold="right" aria-label="Right">▶</button>
    </div>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
